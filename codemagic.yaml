workflows:
  simulator-build:
    name: Baseball simulator build only
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        SUPABASE_URL: https://example.invalid
        SUPABASE_ANON_KEY: simulator-placeholder
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
      - name: Build unsigned iOS simulator app
        script: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild build \
            -project "StatScout.xcodeproj" \
            -scheme "StatScout" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild_logs/baseball.log
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/build/Build/Products/**/*.app
      - $CM_BUILD_DIR/build/Build/Products/**/*.dSYM
