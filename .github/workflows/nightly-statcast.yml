name: Nightly Statcast Refresh

on:
  schedule:
    # Four attempts, one update. The app is meant to wake up holding
    # yesterday's finished data and hold still all day: a refresh that lands
    # mid-afternoon folds half-played games into the season line.
    #
    # So every attempt sits inside the overnight window, and `refresh_guard.py`
    # makes all but the first a no-op. The attempts exist because a GitHub cron
    # is not a promise: they routinely land one to three hours late and are
    # sometimes dropped altogether, which is what left the app reading two days
    # stale. Four shots at the window means one of them lands.
    #
    # West-coast games finish around 06:00 UTC and Savant publishes an hour or
    # two later, so 07:00 is the earliest with any chance of data. 10:00 UTC is
    # 3am PT, which keeps the last attempt inside the "done by 4am PT" budget
    # even when it fires late.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      full_game_log_reingest:
        description: "Re-ingest per-game logs from season start (needed after a metric-set change)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # The nightly incremental path finishes in ~4 minutes. A full game-log
    # re-ingest walks the whole season in 7-day chunks and needs far longer.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: PYTHONPATH=backend python -m pytest backend/tests

      # Every step below is gated on this. A manual dispatch always runs, so
      # there's still a way to force a refresh.
      - name: Decide whether tonight's refresh still has work
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/refresh_guard.py

      - name: Run ingestion (with actual values)
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON || '2026' }}
        run: |
          set -o pipefail
          python backend/ingest.py 2>&1 | tee ingestion.log

      - name: Run per-game ingestion (Recent Form data)
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A metric-set change only reaches already-ingested games via a full
          # re-ingest; the nightly path stays incremental from the last date.
          FULL_REINGEST: ${{ inputs.full_game_log_reingest }}
        run: |
          set -o pipefail
          if [ "$FULL_REINGEST" = "true" ]; then
            python backend/ingest_game_logs.py --full 2>&1 | tee game_logs_ingestion.log
          else
            python backend/ingest_game_logs.py 2>&1 | tee game_logs_ingestion.log
          fi

      - name: Roll up rolling windows (7/15/30 day)
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python backend/rollup_recent_form.py 2>&1 | tee recent_form_rollup.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-logs
          path: |
            backend/tests/
            backend/*.py
            ingestion.log

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly Statcast ingestion failed',
              body: ':warning: Nightly Statcast ingestion failed — check [run logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            })
